# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: asan-newsdata
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true            # GitHub Actions가 data.js를 커밋하면 자동 재배포
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ADMIN_ID
        value: admin
      - key: ADMIN_PASSWORD      # 관리자 비밀번호 (Render 화면에서 직접 입력)
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY      # 선택
        sync: false
